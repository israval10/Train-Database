<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mapa 3D interactivo de grupos y subgrupos musculares del atlas de ejercicios."
    />
    <title>Mapa Muscular 3D</title>
    <link rel="stylesheet" href="styles.css?v=20261007-layout-2" />
  </head>
  <body class="home-page">
    <header class="app-header">
      <div>
        <p id="home-eyebrow" class="eyebrow">Home muscular</p>
        <h1 id="home-title">Mapa Muscular 3D</h1>
      </div>
      <nav class="top-nav" aria-label="Navegacion principal">
        <a id="catalog-link" href="catalog.html">Catalogo</a>
        <div class="language-toggle" role="group" aria-label="Idioma">
          <button id="lang-es" class="is-active" type="button" data-lang="es" aria-pressed="true">
            ES
          </button>
          <button id="lang-en" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </header>

    <main class="home-main">
      <section class="muscle-atlas home-atlas" aria-label="Mapa muscular 3D">
        <div class="atlas-layout">
          <div class="body-stage muscle-viewer" aria-label="Cuerpo humano interactivo">
            <canvas id="muscle-canvas" aria-label="Visor 3D interactivo"></canvas>
            <div id="muscle-tooltip" class="muscle-tooltip" hidden></div>
            <div class="model-credit" aria-label="Credito del modelo 3D">
              Modelo: BodyParts3D / Z-Anatomy
            </div>
          </div>

          <div class="atlas-panel">
            <div class="atlas-selection">
              <span id="atlas-selection-label">Seleccion actual</span>
              <strong id="atlas-selection">Todos los grupos</strong>
              <a id="atlas-open-catalog" class="primary-link" href="catalog.html">Ver catalogo</a>
            </div>
            <div>
              <span id="atlas-groups-label">Grupos</span>
              <div id="atlas-groups" class="atlas-chips"></div>
            </div>
            <div>
              <span id="atlas-subgroups-label">Subgrupos</span>
              <div id="atlas-subgroups" class="subgroup-cloud"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="home.js?v=20261007-subgroups-layout-2" type="module"></script>
  </body>
</html>
